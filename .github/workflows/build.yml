name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: make test
      - name: Build darwin binaries
        run: |
          for arch in arm64 amd64; do
            GOOS=darwin GOARCH=$arch go build -o dist/picb_darwin_$arch ./cmd/picb
          done
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: picb-${{ github.sha }}
          path: dist/
